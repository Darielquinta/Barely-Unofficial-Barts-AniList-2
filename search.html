<style>
    hr.solid {
        border-top: 3px solid #bbb;
    }
</style>
<!DOCTYPE html>
<html>
<head>
<script src="config.js"></script>
</head>
<body>
<script>
var searchQuery = localStorage.getItem("searchQuery");
if (window.USE_MAL_API) {
    var url = `https://api.myanimelist.net/v2/anime?q=${encodeURIComponent(searchQuery)}&limit=3&fields=id,title,main_picture`;
    var options = {
        headers: { 'X-MAL-CLIENT-ID': window.MAL_CLIENT_ID }
    };
    fetch(url, options)
        .then(function(res) { return res.json(); })
        .then(handleMalData)
        .catch(handleError);

    function handleMalData(data) {
        var searchResult = data.data.map(item => `
            <h2><a href="https://myanimelist.net/anime/${item.node.id}" target="_blank">${item.node.title}</a></h2>
        `).join('');
        document.write(`<center> <h1> Search Results </h1> </center>`);
        document.write(` ${searchResult}`);
    }
} else {
    var query = `
    query ($id: Int, $page: Int, $perPage: Int, $search: String) {
      Page (page: $page, perPage: $perPage) {
        pageInfo {
          total
          currentPage
          lastPage
          hasNextPage
          perPage
        }
       media (id: $id, search: $search) {
        id
        title {
          romaji
          english
          native
        }
       }
      }
    }
    `;

    var variables = {
        search: searchQuery,
        page: 1,
        perPage: 3
    };

    var url = 'https://graphql.anilist.co',
        options = {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify({ query: query, variables: variables })
        };

    fetch(url, options)
        .then(handleResponse)
        .then(handleData)
        .catch(handleError);

    function handleResponse(response) {
        return response.json().then(function (json) {
            return response.ok ? json : Promise.reject(json);
        });
    }

    function handleData(data) {
        var searchResult = data.data.Page.media.map(media => `
            <h2> <a href="javascript:void(0);" class="anime-title" data-id="${media.id}"> ${media.title.romaji} </a> </h2>
            <b> Alternate Names: <br> </b>
            ${media.title.english} <br>
            ${media.title.native}
            `).join('');
        document.write(`<center> <h1> Search Results </h1> </center>`);
        document.write(` ${searchResult}`);
        document.querySelectorAll('.anime-title').forEach(function(item) {
            item.addEventListener('click', function(event) {
                var animeId = event.target.getAttribute('data-id');
                window.location.href = `result.html?id=${animeId}`;
            });
        });
    }
}
function handleError(error) {
    alert('Error, check console');
    console.error(error);
}
</script>
</body>
</html>
